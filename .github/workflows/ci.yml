name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Security regression tests
        run: bun run test:security

      - name: Acceptance tests
        run: node --import tsx tests/acceptance.test.ts
        env:
          NODE_ENV: test
          SQLITE_DB_PATH: ./data/humanitybridge-ci.db
          MFA_ENCRYPTION_KEY: ${{ hashFiles('package.json') }}
          ADMIN_BOOTSTRAP_EMAIL: ci-admin@humanitybridge.test
          ADMIN_BOOTSTRAP_PASSWORD: CI-only-Admin-2026!
          SEED_COORDINATOR_PASSWORD: CI-only-Coordinator-2026!
          COORDINATOR_TEST_PASSWORD: CI-only-Coordinator-2026!
