services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      USE_MYSQL: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to mysql://user:password@mysql:3306/database}

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      USE_MYSQL: "true"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to mysql://user:password@mysql:3306/database}
      APP_URL: ${APP_URL:?APP_URL must be the public HTTPS origin}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-s3}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required for production media storage}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:?SIGNED_URL_SECRET is required}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      COOKIE_SECURE: "true"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
    volumes:
      - app_storage:/app/storage

volumes:
  mysql_data:
  app_storage:
