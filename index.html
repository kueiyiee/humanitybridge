<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f5" />
    <title>HumanityBridge | Humanitarian stories and community action</title>
    <meta name="description" content="HumanityBridge connects communities facing hardship with reviewed needs, consent-led stories, and accountable assistance." />
    <meta property="og:title" content="HumanityBridge | Humanitarian stories and community action" />
    <meta property="og:description" content="Explore consent-led stories, publicly reviewed cases, and current programmes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/images/humanitybridge-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("hb_theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = saved === "dark" || (saved !== "light" && prefersDark) ? "dark" : "light";
          const root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
